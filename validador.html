        * {

            padding: 0;

        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 3px solid #ff6b00;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ff6b00;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .header h1 span {
            color: #fff;
        }
        .header p {
            color: #ccc;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b00;
        }
        .card h3 {
            color: #ff6b00;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: #ff6b00;
            color: #fff;
        }
        .btn-primary:hover {
            background: #e05f00;
            transform: scale(1.02);
        }
        .btn-success {
            background: #00c853;
            color: #fff;
        }
        .btn-success:hover {
            background: #00b34a;
        }
        .btn-danger {
            background: #d32f2f;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .btn-secondary {
            background: #444;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .btn-sm {
            padding: 8px 16px;
            width: auto;
            font-size: 0.8rem;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #ff6b00;
        }
        /* Escáner */
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
        }
        #reader video {
            border-radius: 12px;
        }
        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .scanner-controls .btn {
            flex: 1;
        }
        /* Resultado del escaneo */
        .resultado {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            border: 2px solid #444;
        }
        .resultado.exito {
            border-color: #00c853;
        }
        .resultado.error {
            border-color: #d32f2f;
        }
        .resultado .icono {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .resultado .nombre {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        .resultado .detalle {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .resultado .estado {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: 600;
        }
        .estado-exito {
            background: #00c853;
            color: #fff;
        }
        .estado-error {
            background: #d32f2f;
            color: #fff;
        }
        .estado-ya-ingreso {
            background: #ff9800;
            color: #fff;
        }
        .assistant-item {
            background: #1a1a1a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #555;
        }
        .assistant-item.ingresado {
            border-left-color: #00c853;
            opacity: 0.6;
        }
        .assistant-item .info .nombre {
            font-weight: 600;
            color: #fff;
        }
        .assistant-item .info .email {
            font-size: 0.8rem;
            color: #888;
        }
        .assistant-item .info .estado {
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .estado-sin-ingresar {
            background: #d32f2f;
            color: #fff;
        }
        .estado-ingresado {
            background: #00c853;
            color: #fff;
        }

            display: flex;
            gap: 10px;
            margin-bottom: 20px;
